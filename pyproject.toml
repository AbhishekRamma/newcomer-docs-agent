[project]
name = "newcomer-docs-agent"
version = "0.1.0"
description = "RAG agent answering Ontario newcomer questions from official government pages, with citations, refusals and an evaluation gate."
requires-python = ">=3.11,<3.12"
dependencies = [
    "langgraph>=0.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "numpy>=1.26",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pyjwt>=2.8",
    "cryptography>=42",
]

[project.optional-dependencies]
# Local embedding model. Not needed in CI, which replays cached embeddings.
embed = ["sentence-transformers>=2.7"]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is part of the LLM cache key; reflowing it would invalidate the cache.
"src/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
