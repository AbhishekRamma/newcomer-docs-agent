# Fallback for hosts where Docker's bridge network is broken (on my build box, containers
# on the default compose network could not reach each other or resolve DNS).
# Usage: docker compose -f docker-compose.yml -f docker-compose.hostnet.yml up
# Every container shares the host's network: Postgres on 5434, the API on 8000, Keycloak on
# 8080 (plus its management port 9000) and the web app on 5173.
services:
  db:
    network_mode: host
    ports: !reset []
    command: ["postgres", "-p", "5434"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag -p 5434"]

  app:
    network_mode: host
    ports: !reset []
    environment:
      DATABASE_URL: postgresql://rag:rag@localhost:5434/rag
      OIDC_JWKS_URL: http://localhost:8080/realms/newcomer/protocol/openid-connect/certs

  keycloak:
    network_mode: host
    ports: !reset []

  web:
    network_mode: host
    ports: !reset []
