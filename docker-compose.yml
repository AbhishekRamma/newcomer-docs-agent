# LOCAL DEMO STACK, NOT PRODUCTION-READY. Every password in this file and in keycloak/ is a
# demo value for local use only.
# docker compose up  ->  Postgres + pgvector, Keycloak (realm "newcomer" imported on start),
# the API on http://localhost:8000 (migrates, builds the c500 index, serves /ask, /history,
# /health) and the React app on http://localhost:5173.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag   # local demo only
      POSTGRES_DB: rag
    ports:
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env          # DEEPSEEK_API_KEY lives here; the file is gitignored
        required: false
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      LLM_PROVIDER: ${LLM_PROVIDER:-live}
      PYTHONUNBUFFERED: "1"
      # The issuer is the browser-facing URL (what Keycloak puts in "iss"); keys are fetched
      # over the internal network.
      OIDC_ISSUER: http://localhost:8080/realms/newcomer
      OIDC_AUDIENCE: newcomer-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/newcomer/protocol/openid-connect/certs
      WEB_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      # raw pages, embedding cache, LLM cache and spend ledger stay on the host, never in git
      - ./data/local:/app/data/local

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-demo-only   # demo value, local use only
      KC_HOSTNAME: http://localhost:8080             # fixes "iss" whatever the request host
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"        # lets the API fetch keys via keycloak:8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-newcomer.json:/opt/keycloak/data/import/realm-newcomer.json:ro

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_OIDC_AUTHORITY: http://localhost:8080/realms/newcomer
        VITE_OIDC_CLIENT_ID: web
    environment:
      API_ORIGIN: http://localhost:8000
      OIDC_ORIGIN: http://localhost:8080
    ports:
      - "5173:5173"
