name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
      EMBED_PROVIDER: cached
      EMBED_CACHE_PATH: ci/fixtures/embed_cache.sqlite
      LLM_PROVIDER: cached
      LLM_CACHE_DIR: ci/fixtures/llm_cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (no embedding model; CI replays cached vectors)
        run: uv sync --python 3.11 --extra dev --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests (auth, history against the Postgres service, agent)
        env:
          REQUIRE_PG: "1"
        run: uv run pytest -q
      - name: Ingest fixture pages
        run: uv run python -m src.ingest --fixtures ci/fixtures/docs --sizes 500
      - name: Dev evaluation gate (cached LLM and embeddings)
        run: uv run python -m src.evaluate --split dev --name ci-replay --gate ci/thresholds.json

  # Web app (web/): each check is its own job so a failure names itself on the PR.
  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint

  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck

  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build
